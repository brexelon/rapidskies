# RapidSkies network inventory: the single place that says which servers exist,
# which config profiles and plugins each one gets, and how to reach it.
#
# rsdeploy.py reads this file. Values written as ${NAME} are filled from
# infra/secrets.env (never committed) or from the per-server `vars` below.
#
#   ptero_id      The server's Pterodactyl identifier: the 8 characters in its panel URL
#                 (panel.rapidskies.us/server/<ptero_id>), or the full UUID. Panel names
#                 don't match the keys below, so servers are found by this ID only.
#                 `python infra/rsdeploy.py servers` lists every panel server with its ID.
#                 Leave it "" for a server that doesn't exist yet: rsdeploy skips it, and
#                 it's left out of Velocity's server list and `try` order.
#   address       Internal host:port Velocity uses to reach the backend. Leave it out to
#                 use the server's default Pterodactyl allocation (must be on 172.18.0.1).
#   profiles      Applied in order; later profiles override earlier keys.
#   plugins       Plugin sets from `plugin_sets` below, uploaded to /plugins.
#   schedules     Pterodactyl schedules from `schedules` below.
#   worlds        Pre-built worlds (`worlds` below) by the folder they go in on the server:
#                 the level-name folder for the main world, or
#                 <level-name>/dimensions/<namespace>/<key> for a world rapid-core loads by
#                 key. Shipped by `rsdeploy.py worlds` (infra/README.md → Worlds).

servers:
  velocity:
    ptero_id: "89239e13"
    profiles: [velocity]
    plugins: [proxy]
    schedules: [daily-backup]

  hub-1:
    ptero_id: "474c9fe6"
    profiles: [paper-base, hub]
    plugins: [paper-base, hub]
    schedules: [daily-backup]
    vars: { LP_SERVER: hub }
    worlds: { hub: hub }

  hub-2:
    ptero_id: ""
    profiles: [paper-base, hub]
    plugins: [paper-base, hub]
    schedules: [daily-backup]
    vars: { LP_SERVER: hub }
    worlds: { hub: hub }

  skyrealms-1:
    ptero_id: "59776d6d"
    profiles: [paper-base, survival, skyrealms]
    plugins: [paper-base, survival, skyrealms]
    schedules: [hourly-backup]
    vars: { LP_SERVER: skyrealms }
    worlds: { skyrealms_spawn: skyrealms-spawn }

  smp-1:
    ptero_id: "5440367e"
    profiles: [paper-base, survival, smp]
    plugins: [paper-base, survival, smp, worldgen]
    schedules: [hourly-backup]
    vars: { LP_SERVER: smp }
    # The spawn is its own world next to the Heartland (rapid-core loads it as rapidskies:spawn).
    worlds: { heartland/dimensions/rapidskies/spawn: horizons-spawn }

  build:
    ptero_id: ""
    profiles: [paper-base, build]
    plugins: [paper-base, worldgen]
    schedules: [daily-backup]
    vars: { LP_SERVER: build }

  staging:
    # Mirror of a game server for testing updates. Defaults to mirroring smp;
    # swap `smp` for `skyrealms` (profiles and plugin sets: [paper-base, survival, skyrealms])
    # and the world (`skyrealms_spawn: skyrealms-spawn`) when testing SkyRealms.
    ptero_id: ""
    profiles: [paper-base, survival, smp, staging]
    plugins: [paper-base, survival, smp, worldgen]
    # Own database for rapid-* data (Bolts, profiles, ...), so tests never touch production.
    # Created in the panel (staging → Databases), which gives it its own user; the
    # credentials live in secrets.env as STAGING_RAPID_DB_*.
    vars:
      LP_SERVER: staging
      RAPID_DB_NAME: "${STAGING_RAPID_DB_NAME}"
      RAPID_DB_USER: "${STAGING_RAPID_DB_USER}"
      RAPID_DB_PASSWORD: "${STAGING_RAPID_DB_PASSWORD}"
    worlds: { heartland/dimensions/rapidskies/spawn: horizons-spawn }

# Pre-built worlds from the repo's worlds/ folder. Only chunk storage (region/, entities/,
# poi/) is shipped: each server writes its own world data on the next start, using the
# generator from its profile (server.properties for the main world, rapid-core's `worlds`
# config for the rest), and rapid-core sets the spawn point and game rules
# (profiles/*/plugins/rapid-core/).
#
# The three spawns are genMC builds, converted from worlds/revamped/*.schem with
# infra/schem2world.py (infra/README.md -> Worlds). Each is placed so its spawn marker is the
# block at 0 79 0: the spawn is 0.5 80 0.5 facing north (yaw 180) in all three.
#
#   source   Folder holding the world's region/ (and entities/, poi/) directories.
worlds:
  # Rapid Lobby: the yellow medallion on the south spawn terrace, facing the plaza and the
  # spire. Blocks x -99..91, y 37..165, z -151..20.
  hub:
    source: "worlds/revamped/rapid-lobby-spawn"
  # SkyRealms Spawn: the spawn pad's chiseled centre, facing the meadow plaza, the NPC
  # stations and the mountain. Blocks x -72..75, y 37..172, z -114..27.
  skyrealms-spawn:
    source: "worlds/revamped/skyrealms-spawn"
  # Horizons SMP Spawn: the lodestone on the plaza pedestal, facing the portal gate.
  # Blocks x -72..70, y 15..105, z -66..75.
  horizons-spawn:
    source: "worlds/revamped/horizons-smp-spawn"

# Pterodactyl schedules (plan §3: hourly backups for skyrealms and smp, daily for the
# rest). cron is "minute hour day-of-month month day-of-week" in the panel's timezone.
# When a server is at its backup limit, a scheduled backup replaces the oldest unlocked
# one, so set each server's backup limit to the retention you want (e.g. 48 for hourly
# = 2 days, 7 for daily). Long-term retention is the offsite copy (infra/host/).
schedules:
  hourly-backup:
    cron: "0 * * * *"
    action: backup
  daily-backup:
    cron: "30 4 * * *"
    action: backup

# Plugin sets. Each entry is a glob matched against the repo's plugins/ folder, or,
# with a "dist/" prefix, against build/dist/ (the rapid-* jars from `./gradlew dist`).
# Exactly one local jar must match. On upload, any other jar already in the
# server's /plugins folder that matches the same glob (an older version) is removed.
# rapid-* jars keep one name across builds, so they're compared by content, not size.
plugin_sets:
  proxy:
    - "LuckPerms-Velocity-*.jar"
    - "spark-*-velocity.jar"
    - "MiniPlaceholders-Velocity-*.jar"
    # Paid and git-ignored: keep LiteBans.jar in plugins/ locally (infra/README.md).
    - "LiteBans.jar"
    # Velocity kicks 1.19.1+ clients ("A proxy plugin caused an illegal protocol state")
    # when a proxy plugin cancels a signed chat message or command, as LiteBans does for
    # mutes and rapid-proxy does for frozen players. SignedVelocity hands the cancel to
    # the backend instead, so it must also be on every Paper server (paper-base below).
    - "SignedVelocity-Proxy-*.jar"
    - "TAB v*.jar"
    # TAB on Velocity needs it for scoreboard teams (nametag prefixes, tab sorting).
    - "VelocityScoreboardAPI*.jar"
    - "dist/rapid-proxy.jar"
    # The webstore at store.rapidskies.us (plan §6.3): runs package commands on the proxy
    # console (`grant`, `rapid bolts add`, `rapid chargeback`). Set up in infra/README.md → Store.
    - "tebex-velocity-*.jar"

  paper-base:
    - "ViaVersion-*.jar"
    - "ViaBackwards-*.jar"
    - "LuckPerms-Bukkit-*.jar"
    - "spark-*-bukkit.jar"
    - "PlaceholderAPI-*.jar"
    - "grimac-bukkit-*.jar"
    # Passes PlaceholderAPI values (%rapid_prefix%) and vanish state up to TAB on the proxy.
    - "TAB-Bridge*.jar"
    # Backend half of SignedVelocity (see the proxy set): drops chat and commands that
    # the proxy cancelled, so the client's signed-chat chain stays valid.
    - "SignedVelocity-Paper-*.jar"
    - "dist/rapid-core.jar"
    # Everyday commands (/spawn, /back, /tpa, homes, warps, /pay...); the profiles switch off
    # what a server doesn't use (disabled-commands).
    - "dist/rapid-essentials.jar"

  hub:
    # The mode NPCs on the stage (rapid-hub builds them from its config; Citizens never
    # saves them). Holograms are rapid-hub's own text displays, so DecentHolograms isn't needed.
    - "Citizens-*.jar"
    - "dist/rapid-hub.jar"

  survival:
    # Vault API for the Coins/Crowns economy rapid-core provides (server.gamemode).
    - "VaultUnlocked-*.jar"
    # Block logging for grief and rollback investigations (plan §4).
    - "CoreProtect-CE-*.jar"
    # The auction house (plan §4.2), on both gamemodes: each server trades in its own
    # currency (rapid-core's server.gamemode), and listings never cross modes.
    - "dist/rapid-market.jar"

  # SkyRealms (plan §5.1): the island engine and the gamemode on top of it (starter islands,
  # Realm Tiers, the shop, Expeditions, Trade Routes, seasons). rapid-skyrealms registers its
  # island layouts with SuperiorSkyblock2 while loading, so both must be on every SkyRealms server.
  skyrealms:
    - "SuperiorSkyblock2-*.jar"
    - "dist/rapid-skyrealms.jar"
    # The NPCs round the spawn's meadow plaza (rapid-skyrealms builds them from its
    # config; Citizens never saves them).
    - "Citizens-*.jar"

  # Horizons (plan §4.1, §5.2): claims and towns, the gamemode itself, and chest shops.
  # rapid-claims must be on every Horizons server: without it the Heartland is unprotected.
  smp:
    - "dist/rapid-claims.jar"
    - "dist/rapid-horizons.jar"
    # Shops only inside claims where the creator is a Member (rapid-claims' hook); its own
    # fake-break protection check is off (profiles/smp/plugins/QuickShop-Hikari).
    - "QuickShop-Hikari-*.jar"
    # The NPCs around the spawn plaza (rapid-horizons builds them from its config; Citizens
    # never saves them).
    - "Citizens-*.jar"
    # Manages the Heartland and the Frontier worlds; rapid-horizons registers its Frontier
    # terrain generators with it (rapid-horizons:<modifier>). Its own spawn, respawn, game
    # mode and flight handling are off (profiles/smp/plugins/Multiverse-Core).
    - "multiverse-core-*.jar"

  worldgen:
    - "Chunky-Paper-*.jar"
    - "ChunkyBorder-Paper-*.jar"
