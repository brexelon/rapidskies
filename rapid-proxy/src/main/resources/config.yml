# rapid-proxy (Velocity). Written on first start; rsdeploy then fills in the
# connection settings from infra/secrets.env
# (infra/profiles/velocity/plugins/rapid-proxy/config.yml.patch).

# Shared MariaDB schema used by every rapid-* plugin.
database:
  host: 127.0.0.1
  port: 3306
  name: rapidskies
  user: rapidskies
  password: ""
  pool-size: 4

redis:
  host: 127.0.0.1
  port: 6379
  password: ""

# Group whose servers players join on login and fall back to when kicked.
hub-group: hub

registry:
  # How often to read backend heartbeats from Redis.
  poll-millis: 2000
  # Register backends that announce an internal address in their heartbeat but aren't in
  # velocity.toml yet (new instances on a new node). Only private addresses are accepted.
  auto-register: true

motd:
  # Line 2 of the server list MOTD rotates through lang `motd.rotation` this often.
  rotate-seconds: 8

# Oldest client protocol allowed in (763 = 1.20 / 1.20.1). Older clients get lang `kick.version`.
minimum-protocol: 763

# Every value below also has a built-in default, so a config.yml written by an older
# build keeps working; add a section here only to change it.

# Join queue (/play and the hub selector).
queue:
  # Server groups players may join, and the name players see. Staff-only servers
  # (build, staging) are left out on purpose; staff use /server.
  groups:
    hub: Lobby
    skyrealms: Skyrealms
    smp: Horizons SMP
  # Place in line on full servers, highest first (PLAN.md §6.1). `staff` is any team role.
  priority:
    default: 0
    rapidplus: 1
    rapidplusplus: 1
    rapidplusplusplus: 2
    staff: 3

parties:
  # Max members by the leader's rank, leader included (PLAN.md §6.1).
  size:
    default: 4
    rapidplus: 6
    rapidplusplus: 8
    rapidplusplusplus: 12
  invite-seconds: 60
  # Members follow the leader when the leader moves to a server in one of these groups.
  follow-groups: [hub, skyrealms, smp]

friends:
  # Friend-list size by rank (PLAN.md §6.1).
  limit:
    default: 100
    rapidplus: 150
    rapidplusplus: 250
    rapidplusplusplus: 500

# Tailwind, the rested bonus (PLAN.md §5.3). Time away from the network banks bonus time
# that's spent while playing a gamemode (+50% mode XP and Trade income). Tune in beta.
tailwind:
  # Bonus banked per full day away.
  minutes-per-offline-day: 120
  # Days of absence that count at most, so the bank tops out at 3 x 120 min = 6 hours.
  max-offline-days: 3
