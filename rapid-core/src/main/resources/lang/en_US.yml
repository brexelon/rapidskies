# rapid-core messages (MiniMessage). Brand tags: <primary> <accent> <text> <muted> <dark>
# <success> <error>, and <prefix> for "RAPIDSKIES »".
#
# Every supported client (1.20 – 26.3) renders hex colors, <gradient>, <hover>, <click>
# and <key> exactly. <key:key.use>, <key:key.sneak> and <key:key.chat> show the player's own
# keybind ("Right Button", "Left Shift", "T"), so instructions stay right for players who
# rebind. Don't use <shadow> (1.21.4+), <sprite>/<head> (1.21.9+) or anything else newer
# than 1.20: 1.20 clients drop it. Menu titles, item names and lore are components too, but
# clicks and hovers do nothing there.

# Rank and staff prefixes (PLAN.md §6.1, §9). <plus>...</plus> takes the player's plus color.
rank:
  prefix:
    rapidplus: "<primary>[RAPID</primary><plus>+</plus><primary>]</primary> "
    rapidplusplus: "<primary>[RAPID</primary><plus>++</plus><primary>]</primary> "
    rapidplusplusplus: "<primary>[<bold>RAPID</bold></primary><plus>+++</plus><primary>]</primary> "
  # Red shades are reserved for the team; plus colors can never use them.
  staff:
    owner: "<dark_red><bold>[OWNER]</bold></dark_red> "
    admin: "<dark_red>[ADMIN]</dark_red> "
    developer: "<red>[DEV]</red> "
    srmod: "<red>[SR. MOD]</red> "
    moderator: "<red>[MOD]</red> "
    helper: "<red>[HELPER]</red> "
    builder: "<red>[BUILDER]</red> "

# <rank> is the prefix above (empty for default players), <player> the name, <message> what they typed.
chat:
  default: "<muted><player></muted><dark>:</dark> <muted><message></muted>"
  ranked: "<rank><text><player></text><dark>:</dark> <text><message></text>"
  staff: "<rank><text><player></text><dark>:</dark> <text><message></text>"

login:
  # Shown on the disconnect screen if the profile can't be loaded (database trouble).
  profile-failed: |-
    <primary><bold>RAPID</bold></primary><white><bold>SKIES</bold></white>

    <text>We couldn't load your profile.</text>
    <muted>Please try again in a minute.</muted>

plus:
  # The /plus menu (5 rows). <preview> is a prefix in the color the item stands for.
  menu:
    title: "<dark>Plus color</dark>"
    preview-name: "<primary>Your prefix</primary>"
    preview-lore: "<preview><text>You</text>"
    # The color's own name, drawn in that color (or gradient) by <plus>.
    color-name: "<plus><name></plus>"
    color-preview: "<muted>Preview:</muted> <preview><text>You</text>"
    color-click: "<accent>Click to use</accent>"
    color-selected: "<success>✔ Selected</success>"
    color-locked: "<error>Needs <rank> or higher</error>"
    reset-name: "<text>Reset</text>"
    reset-lore: "<muted>Back to the default:</muted> <preview><text>You</text>"
  set: "<prefix><success>Plus color set.</success> <text>Your prefix:</text> <preview>"
  reset: "<prefix><success>Plus color reset.</success> <text>Your prefix:</text> <preview>"
  needs-rank: "<prefix><error>Plus colors are a Rapid+ perk.</error> <muted>See</muted> <primary><click:open_url:'https://store.rapidskies.us'><hover:show_text:'<muted>Open the store in your browser'>store.rapidskies.us</hover></click></primary>"
  locked: "<prefix><error><name> needs <rank> or higher.</error>"
  unknown: "<prefix><error>There's no color called <text><input></text>.</error> <muted>Type</muted> <click:run_command:'/plus'><hover:show_text:'<muted>Open the color menu'><text>/plus</text></hover></click> <muted>to see your options.</muted>"
  reserved: "<prefix><error>Red shades are reserved for staff.</error>"
  failed: "<prefix><error>Couldn't save that right now; please try again.</error>"

bolts:
  balance: "<prefix><primary>⚡</primary> <text>You have</text> <accent><balance> Bolts</accent><text>.</text>"
  balance-other: "<prefix><primary>⚡</primary> <text><player> has</text> <accent><balance> Bolts</accent><text>.</text>"
  unknown-player: "<prefix><error>No player <text><player></text> has ever joined.</error>"
  failed: "<prefix><error>Couldn't load Bolts right now; please try again.</error>"

afk:
  now-afk: "<prefix><muted>You're now AFK. Playtime rewards and Tailwind are paused until you're back.</muted>"
  back: "<prefix><text>Welcome back!</text>"
  # %rapid_afk% (tab list suffix); a leading space keeps it apart from the name.
  tag: " <dark>[AFK]</dark>"

# Tailwind (PLAN.md §5.3). <time> is what's left ("2h 15m"), <bonus> the percent.
tailwind:
  join: "<prefix><primary>Tailwind:</primary> <text><time> of</text> <accent>+<bonus>%</accent> <text>mode XP and Trade income.</text>"
  depleted: "<prefix><muted>Your Tailwind has run out. Time away from the network builds it back up.</muted>"
  empty: "<prefix><text>No Tailwind banked.</text> <muted>Time away from the network banks a</muted> <accent>+<bonus>%</accent> <muted>bonus for your next session.</muted>"
  banked: "<prefix><primary>Tailwind:</primary> <text><time> banked.</text> <muted>It's spent while you play Skyrealms or Horizons, for</muted> <accent>+<bonus>%</accent> <muted>mode XP and Trade income.</muted>"
  active: "<prefix><primary>Tailwind:</primary> <text><time> left,</text> <accent>+<bonus>%</accent> <text>mode XP and Trade income right now.</text>"
  paused: "<prefix><primary>Tailwind:</primary> <text><time> left,</text> <muted>paused while you're AFK.</muted>"

rewards:
  playtime: "<prefix><primary>⚡</primary> <accent>+<amount> Bolts</accent> <muted>for <minutes> minutes of play.</muted>"

# Staff tools (PLAN.md §9). Staff-facing text, so it can be terse.
staff:
  usage-player: "<prefix><error>Name a player on this server.</error>"
  not-here: "<prefix><error><player> isn't on this server.</error>"
  mode:
    enabled: "<prefix><success>Staff mode on.</success> <muted>Your inventory comes back when you leave.</muted>"
    disabled: "<prefix><text>Staff mode off.</text> <muted>Inventory restored.</muted>"
    teleported: "<prefix><text>Teleported to <player>.</text>"
    nobody: "<prefix><muted>Nobody else to teleport to.</muted>"
    click-a-player: "<prefix><muted>Use this on a player</muted> <text>(<key:key.use>)</text><muted>.</muted>"
  tool:
    random-name: "<primary>Random player</primary> <muted>(<key:key.use>)</muted>"
    random-lore:
      - "<muted>Teleports you to a random player</muted>"
      - "<muted>on this server.</muted>"
    inspect-name: "<primary>Inspect</primary> <muted>(<key:key.use> on a player)</muted>"
    inspect-lore:
      - "<muted>Shows their inventory.</muted>"
      - "<muted>Hold</muted> <text><key:key.sneak></text> <muted>to see their ender chest.</muted>"
    freeze-name: "<primary>Freeze</primary> <muted>(<key:key.use> on a player)</muted>"
    freeze-lore:
      - "<muted>Freezes or releases them.</muted>"
    players-name: "<primary>Players</primary> <muted>(<key:key.use>)</muted>"
    players-lore:
      - "<muted>Everyone on this server.</muted>"
    vanish-on-name: "<success>Vanished</success> <muted>(<key:key.use> to appear)</muted>"
    vanish-on-lore:
      - "<muted>Players can't see you.</muted>"
    vanish-off-name: "<error>Visible</error> <muted>(<key:key.use> to vanish)</muted>"
    vanish-off-lore:
      - "<muted>Players can see you.</muted>"
    exit-name: "<error>Leave staff mode</error> <muted>(<key:key.use>)</muted>"
    exit-lore:
      - "<muted>Gives your inventory back.</muted>"
  vanish:
    enabled: "<prefix><success>You're vanished.</success> <muted>Players can't see you, here or in friend lists.</muted>"
    disabled: "<prefix><text>You're visible again.</text>"
    still: "<prefix><muted>You're still vanished.</muted> <click:run_command:'/vanish'><hover:show_text:'<muted>Become visible'><text>/vanish</text></hover></click> <muted>to appear.</muted>"
  freeze:
    froze: "<prefix><text>Froze <player>.</text> <muted>Talk to them in chat; use the ice again to release.</muted>"
    released-staff: "<prefix><text>Released <player>.</text>"
    exempt: "<prefix><error><player> can't be frozen.</error>"
    rejoined: "<prefix><error><player> rejoined while frozen.</error> <muted>They're frozen again.</muted>"
    released: "<prefix><success>You've been released. Thanks for your patience.</success>"
    no-commands: "<prefix><error>You can't use commands while frozen.</error>"
    reminder: "<prefix><error>You're frozen.</error> <text>A staff member will talk to you in chat</text> <muted>(press</muted> <accent><key:key.chat></accent><muted>)</muted><text>. Don't log out: that counts as refusing a check.</text>"
    title: "<error><bold>FROZEN</bold></error>"
    subtitle: "<text>Press</text> <accent><key:key.chat></accent> <text>to chat, and don't log out</text>"
    menu-title: "<dark>You've been frozen</dark>"
    menu-name: "<error><bold>You've been frozen</bold></error>"
    menu-lore:
      - "<text>A staff member wants to check your client.</text>"
      - "<text>They'll talk to you in chat.</text>"
      - ""
      - "<error>Logging out counts as refusing the check.</error>"
    menu-close: "<accent>Close this, then press</accent> <text><key:key.chat></text> <accent>to chat</accent>"
  inspect:
    title: "<dark><player>'s inventory</dark>"
    ender-title: "<dark><player>'s ender chest</dark>"
    info-name: "<primary><player></primary>"
    info-health: "<muted>Health</muted> <text><health></text> <dark>•</dark> <muted>Food</muted> <text><food></text>"
    info-mode: "<muted>Game mode</muted> <text><mode></text>"
    info-location: "<muted>At</muted> <text><world> <x>, <y>, <z></text>"
    refresh: "<accent>Refresh</accent>"
    gone: "<prefix><muted><player> left this server.</muted>"
  players:
    title: "<dark>Players here</dark>"
    name: "<text><player></text>"
    frozen: "<error>Frozen</error>"
    vanished: "<muted>Vanished</muted>"
    click: "<accent>Click</accent> <muted>to teleport,</muted> <accent>shift-click</accent> <muted>to inspect</muted>"
    page: "<muted>Page <page>/<pages></muted>"
    previous: "<accent>Previous page</accent>"
    next: "<accent>Next page</accent>"

errors:
  players-only: "<prefix><error>Only players can use this.</error>"
  # RapidCore#connect couldn't reach the proxy (Redis down).
  connect-failed: "<prefix><error>Couldn't reach the network right now; please try again.</error>"
