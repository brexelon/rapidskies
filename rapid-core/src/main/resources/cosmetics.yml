# The cosmetics catalog and the Bolt shop (PLAN.md §6.1, §6.2). Read from the rapid-core jar
# on every server, never copied to disk, so every server sells and shows the same things:
# change it here, rebuild and deploy (`rsdeploy.py plugins --restart`).
#
# Ids are <type>:<name>. Each type fills one slot, so a player wears one of each:
#   title      on the profile card (hover a name in chat), the hub sidebar and %rapid_title%
#   tag        a symbol in front of the name in chat (%rapid_tag%)
#   namecolor  the name's color in chat: a named chat color, never red or dark_red (staff)
#   badge      on the profile card and %rapid_badge%
#   trail      particles at the feet while walking (servers with cosmetics.trails on)
#   arrow      particles behind arrows, tridents, snowballs and eggs the player shoots
#
# An entry:
#   name     the plain name in menus
#   display  what it renders. title/tag/badge: MiniMessage text. namecolor: a color name.
#            trail/arrow: a particle (1.20 has every one listed here), or "dust #RRGGBB"
#   rarity   common | rare | epic | legendary (only the menu color)
#   obtain   shop      bought with Bolts in the Bolt shop (price)
#            featured  bought with Bolts only in a week it's in the Featured Shop (price)
#            rank      worn while the player has `rank` or higher (the rank sets, §6.1);
#                      never stored, so it comes and goes with the rank
#            level | achievement | pass | chapter | season | event   granted by that system
#   price    Bolts (shop, featured)
#   rank     rapidplus | rapidplusplus | rapidplusplusplus (obtain: rank)
#   icon     the menu item
#   hint     for a locked item: how to get it (MiniMessage)
# A name may contain <n> (title:season-<n>-champion): it stands for any number, which the
# display and name show in its place.
#
# Nothing here changes gameplay (§6.1 "not sold" list), and the shop refuses to sell
# anything that isn't tagged COSMETIC or CONVENIENCE (§8).

