# The weekly Featured Shop (§6.2, §12): `size` featured-only items on show at a time, changing
# every Monday 00:00 UTC. Each comes round before any repeats, and none shows two weeks
# running while there are at least 3 × size of them. Every cosmetic with obtain: featured is
# in the rotation.
featured:
  size: 4

# 30-day rank passes bought with Bolts (§6.1). They stack with store subscriptions and each
# other; the proxy grants them through /grant, so they show up in /grants like any rank.
rank-passes:
  rapidplus: { price: 1000, days: 30, icon: GOLD_NUGGET }
  rapidplusplus: { price: 2000, days: 30, icon: GOLD_INGOT }
  rapidplusplusplus: { price: 4000, days: 30, icon: GOLD_BLOCK }
