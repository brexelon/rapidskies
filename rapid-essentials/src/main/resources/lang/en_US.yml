# rapid-essentials messages (MiniMessage). Brand tags: <primary> <accent> <text> <muted> <dark>
# <success> <error>, and <prefix> for "RAPIDSKIES »".
#
# Every supported client (1.20 – 26.3) renders hex colors, <gradient>, <hover>, <click>
# and <key> exactly. Don't use <shadow> (1.21.4+), <sprite>/<head> (1.21.9+) or anything else
# newer than 1.20: 1.20 clients drop it.
#
# Buttons whose command is built in code are tags here: <accept>…</accept> runs /tpaccept for
# that player, <go>…</go> goes to that home or warp. Put the text and hover inside them.

errors:
  players-only: "<prefix><error>Only players can use this.</error>"
  not-here: "<prefix><error><player> isn't on this server.</error>"
  # Staff tools that take an optional player (/fly, /heal...). <command> is the command's name.
  usage-target: "<prefix><text>Usage: <accent>/<command></accent> <muted>[player]</muted></text>"
  console-name: "<prefix><error>From the console, name a player.</error>"
  no-others: "<prefix><error>You can only use that on yourself.</error>"
  busy-self: "<prefix><muted>Not while you're in staff or build mode.</muted>"
  busy-other: "<prefix><error><player> is in staff or build mode.</error>"
  dead: "<prefix><error><player> is dead.</error>"

# Every teleport command (/spawn, /back, /home, /warp, /tpa). <time> is "8s", "1m 30s".
teleport:
  warmup: "<prefix><text>Teleporting in <accent><seconds>s</accent>.</text> <muted>Don't move.</muted>"
  cancelled-move: "<prefix><error>Teleport cancelled:</error> <muted>you moved.</muted>"
  cancelled-damage: "<prefix><error>Teleport cancelled:</error> <muted>you took damage.</muted>"
  cooldown: "<prefix><error>You can do that again in <accent><time></accent>.</error>"
  frozen: "<prefix><error>You can't teleport while frozen.</error>"
  gone: "<prefix><error>Where you were going isn't there any more.</error>"
  unsafe: "<prefix><error>That spot isn't safe to go to.</error>"
  failed: "<prefix><error>Couldn't take you there.</error> <muted>Try again in a moment.</muted>"

# /spawn and /setspawn.
spawn:
  teleported: "<prefix><text>Welcome back to the spawn.</text>"
  # <line> is the spawn.location line for the server's rapid-core profile; clicking it copies the value.
  set: "<prefix><success>Spawn moved here until the next restart.</success> <muted>To keep it, put this in the server's rapid-core profile:</muted> <accent><line></accent>"
  copy-hint: "<muted>Click to copy"

# /back.
back:
  returned: "<prefix><text>Back where you were.</text> <muted>Use <accent>/back</accent> again to return.</muted>"
  returned-death: "<prefix><text>Back where you died.</text>"
  none: "<prefix><muted>There's nowhere to go back to yet.</muted>"
  gone: "<prefix><error>That world isn't around any more.</error>"

# /tpa, /tpahere, /tpaccept, /tpdeny, /tpacancel, /tptoggle. <seconds> is how long a request lasts.
tpa:
  usage: "<prefix><text>Usage: <accent>/tpa</accent> <muted><player></muted></text>"
  usage-here: "<prefix><text>Usage: <accent>/tpahere</accent> <muted><player></muted></text>"
  not-here: "<prefix><error><player> isn't on this server.</error>"
  self: "<prefix><muted>That's you.</muted>"
  refusing: "<prefix><error><player> isn't taking teleport requests.</error>"
  sent: "<prefix><text>Asked <accent><player></accent> if you can teleport to them.</text> <muted>It expires in <seconds>s.</muted> <cancel><hover:show_text:'<muted>Withdraw the request'><error>[Cancel]</error></hover></cancel>"
  sent-here: "<prefix><text>Asked <accent><player></accent> to teleport to you.</text> <muted>It expires in <seconds>s.</muted> <cancel><hover:show_text:'<muted>Withdraw the request'><error>[Cancel]</error></hover></cancel>"
  received: "<prefix><accent><player></accent> <text>wants to teleport to you.</text> <accept><hover:show_text:'<muted>They come to you'><success>[Accept]</success></hover></accept> <deny><hover:show_text:'<muted>Say no'><error>[Deny]</error></hover></deny> <muted>(<seconds>s)</muted>"
  received-here: "<prefix><accent><player></accent> <text>wants you to teleport to them.</text> <accept><hover:show_text:'<muted>You go to them'><success>[Accept]</success></hover></accept> <deny><hover:show_text:'<muted>Say no'><error>[Deny]</error></hover></deny> <muted>(<seconds>s)</muted>"
  none: "<prefix><muted>You have no open teleport requests.</muted>"
  none-from: "<prefix><muted>There's no open request from <player>.</muted>"
  blocked: "<prefix><error><player> can't teleport right now.</error>"
  you-accepted: "<prefix><success>Accepted <player>'s request.</success>"
  accepted: "<prefix><success><player> accepted your request.</success>"
  arrived: "<prefix><text>Teleported to <accent><player></accent>.</text>"
  you-denied: "<prefix><text>Denied <player>'s request.</text>"
  denied: "<prefix><error><player> denied your request.</error>"
  nothing-to-cancel: "<prefix><muted>You have no request to cancel.</muted>"
  cancelled: "<prefix><text>Withdrew your request to <player>.</text>"
  cancelled-by: "<prefix><muted><player> withdrew their teleport request.</muted>"
  toggled-off: "<prefix><text>You're no longer taking teleport requests.</text> <muted><accent>/tptoggle</accent> again to allow them; it resets when you leave.</muted>"
  toggled-on: "<prefix><success>You're taking teleport requests again.</success>"

# /home, /sethome, /delhome, /homes. <limit> is homes.limit, the same for everyone.
homes:
  arrived: "<prefix><text>Welcome home</text> <muted>(<accent><name></accent>)</muted><text>.</text>"
  set: "<prefix><success>Home <accent><name></accent> set.</success> <muted>Go back with <accent>/home <name></accent>.</muted>"
  moved: "<prefix><success>Home <accent><name></accent> moved here.</success>"
  deleted: "<prefix><text>Home <accent><name></accent> deleted.</text>"
  limit: "<prefix><error>You already have <limit> homes.</error> <muted>Move one with <accent>/sethome <name></accent> or remove one with <accent>/delhome</accent>.</muted>"
  none: "<prefix><muted>You have no homes here yet.</muted> <click:run_command:'/sethome'><hover:show_text:'<muted>Set one where you stand'><accent>/sethome</accent></hover></click> <muted>sets one.</muted>"
  unknown: "<prefix><error>You have no home called <text><name></text>.</error> <click:run_command:'/homes'><hover:show_text:'<muted>List your homes'><accent>/homes</accent></hover></click>"
  world-gone: "<prefix><error>Home <name> was in a world that's gone.</error> <muted>Remove it with <accent>/delhome <name></accent>.</muted>"
  invalid-name: "<prefix><error>A home name is up to <max> letters, digits, - or _.</error>"
  blocked-world: "<prefix><error>You can't set a home in this world.</error> <muted>It doesn't last.</muted>"
  list: "<prefix><text>Your homes</text> <muted>(<count>/<limit>):</muted> <homes>"
  entry: "<go><hover:show_text:'<muted>Click to go there'><accent><name></accent></hover></go>"
  separator: "<dark>, </dark>"
  usage-delete: "<prefix><text>Usage: <accent>/delhome</accent> <muted><name></muted></text>"
  loading: "<prefix><muted>Your homes are still loading; try again in a moment.</muted>"
  failed: "<prefix><error>Couldn't save that right now; please try again.</error>"

# /warp, /warps, /setwarp, /delwarp.
warps:
  arrived: "<prefix><text>Warped to <accent><name></accent>.</text>"
  list: "<prefix><text>Warps</text> <muted>(<count>):</muted> <warps>"
  entry: "<go><hover:show_text:'<muted>Click to warp there'><accent><name></accent></hover></go>"
  separator: "<dark>, </dark>"
  none: "<prefix><muted>There are no warps on this server.</muted>"
  unknown: "<prefix><error>There's no warp called <text><name></text>.</error> <click:run_command:'/warps'><hover:show_text:'<muted>List the warps'><accent>/warps</accent></hover></click>"
  world-gone: "<prefix><error>Warp <name> is in a world that isn't loaded.</error>"
  set: "<prefix><success>Warp <accent><name></accent> created here.</success>"
  moved: "<prefix><success>Warp <accent><name></accent> moved here.</success>"
  deleted: "<prefix><text>Warp <accent><name></accent> deleted.</text>"
  invalid-name: "<prefix><error>A warp name is up to <max> letters, digits, - or _.</error>"
  usage-set: "<prefix><text>Usage: <accent>/setwarp</accent> <muted><name></muted></text>"
  usage-delete: "<prefix><text>Usage: <accent>/delwarp</accent> <muted><name></muted></text>"
  failed: "<prefix><error>Couldn't save that right now; please try again.</error>"

# /balance, /pay, /baltop, /eco. <amount> is "1,250", <currency> "Crowns" or "Coins" (singular for 1).
money:
  balance: "<prefix><text>You have</text> <accent><amount> <currency></accent><text>.</text>"
  balance-other: "<prefix><text><player> has</text> <accent><amount> <currency></accent><text>.</text>"
  usage-balance: "<prefix><text>Usage: <accent>/balance</accent> <muted><player></muted></text>"
  no-others: "<prefix><error>You can only see your own balance.</error>"
  usage-pay: "<prefix><text>Usage: <accent>/pay</accent> <muted><player> <amount></muted></text>"
  invalid-amount: "<prefix><error><input> isn't an amount.</error> <muted>Use a whole number, like 250, 1,500 or 2.5k.</muted>"
  pay-minimum: "<prefix><error>The smallest payment is <amount> <currency>.</error>"
  pay-self: "<prefix><muted>You can't pay yourself.</muted>"
  insufficient: "<prefix><error>You don't have enough.</error> <muted>You have <accent><amount> <currency></accent>.</muted>"
  paid: "<prefix><success>Paid <accent><player></accent> <accent><amount> <currency></accent>.</success>"
  received: "<prefix><success><accent><player></accent> paid you <accent><amount> <currency></accent>.</success>"
  unknown-player: "<prefix><error>No player <text><player></text> has ever joined.</error>"
  top-header: "<prefix><primary>Richest players</primary> <muted>(<currency>)</muted>"
  top-line: "<dark>#</dark><muted><rank></muted> <text><player></text> <dark>»</dark> <accent><amount></accent>"
  top-empty: "<prefix><muted>Nobody has any yet.</muted>"
  usage-eco: "<prefix><text>Usage: <accent>/eco</accent> <muted>give|take <player> <amount></muted></text>"
  eco-given: "<prefix><success>Gave <player> <amount> <currency>.</success> <muted>Balance: <balance>.</muted>"
  eco-taken: "<prefix><success>Took <amount> <currency> from <player>.</success> <muted>Balance: <balance>.</muted>"
  eco-insufficient: "<prefix><error><player> only has <amount> <currency>.</error>"
  failed: "<prefix><error>Couldn't do that right now; please try again.</error>"

ping:
  self: "<prefix><text>Your ping:</text> <accent><ping> ms</accent>"
  other: "<prefix><text><player>'s ping:</text> <accent><ping> ms</accent>"

# /list. <rank> is the player's prefix ("RAPID++ "), empty for players without one.
list:
  players: "<prefix><text>On <accent><server></accent> (<count>):</text> <players>"
  empty: "<prefix><muted>Nobody else is here.</muted>"
  entry: "<rank><text><player></text>"
  entry-vanished: "<rank><muted><italic><player></italic></muted>"
  separator: "<dark>, </dark>"

# /seen (staff). <ago> and <first> are "3d 4h".
seen:
  usage: "<prefix><text>Usage: <accent>/seen</accent> <muted><player></muted></text>"
  online-here: "<prefix><text><player> is</text> <success>online</success> <text>here on <accent><server></accent>.</text>"
  last: "<prefix><text><player> last joined</text> <accent><server></accent> <text><ago> ago.</text> <muted>First joined <first> ago.</muted>"
  never: "<prefix><error>No player <text><player></text> has ever joined.</error>"
  failed: "<prefix><error>Couldn't look that up right now; please try again.</error>"

# /hat (a Horizons Rapid+ perk).
hat:
  done: "<prefix><success>Looking good.</success>"
  empty: "<prefix><muted>Hold the item you want to wear.</muted>"
  cursed: "<prefix><error>Your helmet won't come off.</error>"
  full: "<prefix><error>Make room in your inventory for your old helmet first.</error>"
  not-now: "<prefix><muted>Not while your inventory is set aside.</muted>"

# Text pages (config info-commands): info.<command>. A list is one line per entry.
info:
  rules:
    - "<prefix><primary><bold>Rules</bold></primary>"
    - "<dark>•</dark> <text>No cheats, hacked clients, X-ray or auto-clickers.</text>"
    - "<dark>•</dark> <text>No duplicating items or abusing bugs.</text> <muted>Report them to staff instead.</muted>"
    - "<dark>•</dark> <text>No griefing, stealing or scamming.</text>"
    - "<dark>•</dark> <text>Be respectful: no harassment, hate or spam.</text>"
    - "<dark>•</dark> <text>No advertising, and no trading items or currency for real money.</text>"
    - "<muted>More, and appeals, at</muted> <primary><click:open_url:'https://rapidskies.us'><hover:show_text:'<muted>Open the website in your browser'>rapidskies.us</hover></click></primary>"
  store: "<prefix><text>Ranks and Bolts, cosmetic only:</text> <primary><click:open_url:'https://store.rapidskies.us'><hover:show_text:'<muted>Open the store in your browser'>store.rapidskies.us</hover></click></primary>"
  website: "<prefix><text>News, rules and appeals:</text> <primary><click:open_url:'https://rapidskies.us'><hover:show_text:'<muted>Open the website in your browser'>rapidskies.us</hover></click></primary>"

# ---------------------------------------------------------------- staff tools
# Used on someone else, the sender gets the "-other" line (with <player>) and the player gets
# the "by-staff" one, which never names the staff member (they may be vanished).

# /gamemode, /gmc, /gms, /gma, /gmsp. <mode> is the game mode's name in the reader's language.
gamemode:
  usage: "<prefix><text>Usage: <accent>/gamemode</accent> <muted>survival|creative|adventure|spectator [player]</muted></text>"
  unknown: "<prefix><error><input> isn't a game mode.</error> <muted>Try survival, creative, adventure or spectator.</muted>"
  no-permission: "<prefix><error>You can't switch to <mode>.</error>"
  set: "<prefix><success>Game mode set to <accent><mode></accent>.</success>"
  set-other: "<prefix><success>Set <accent><player></accent>'s game mode to <accent><mode></accent>.</success>"
  changed: "<prefix><text>A staff member set your game mode to <accent><mode></accent>.</text>"

# /fly. Flight given to someone without /fly of their own ends when they leave.
fly:
  enabled: "<prefix><success>Flight on.</success> <muted>Double-tap <accent><key:key.jump></accent> to take off.</muted>"
  disabled: "<prefix><text>Flight off.</text>"
  enabled-other: "<prefix><success>Flight on for <accent><player></accent>.</success> <muted>It ends when they leave.</muted>"
  disabled-other: "<prefix><text>Flight off for <accent><player></accent>.</text>"
  given: "<prefix><success>A staff member let you fly.</success> <muted>Double-tap <accent><key:key.jump></accent> to take off.</muted>"
  taken: "<prefix><text>A staff member turned your flight off.</text>"
  innate: "<prefix><muted><player> flies in <mode> anyway.</muted>"

# /god: no damage (except the void and /kill) or hunger, and no hurting other players.
god:
  enabled: "<prefix><success>God mode on.</success> <muted>You can't hurt other players while it's on.</muted>"
  disabled: "<prefix><text>God mode off.</text>"
  enabled-other: "<prefix><success>God mode on for <accent><player></accent>.</success>"
  disabled-other: "<prefix><text>God mode off for <accent><player></accent>.</text>"
  given: "<prefix><success>A staff member made you invulnerable.</success>"
  taken: "<prefix><text>A staff member turned your god mode off.</text>"
  # Action bar, when a player in god mode hits another player.
  no-pvp: "<error>You can't hurt players in god mode.</error> <muted>/god turns it off.</muted>"

heal:
  self: "<prefix><success>Healed.</success>"
  other: "<prefix><success>Healed <accent><player></accent>.</success>"
  by-staff: "<prefix><success>A staff member healed you.</success>"

feed:
  self: "<prefix><success>You're full.</success>"
  other: "<prefix><success>Fed <accent><player></accent>.</success>"
  by-staff: "<prefix><success>A staff member fed you.</success>"

extinguish:
  self: "<prefix><success>Fire's out.</success>"
  other: "<prefix><success>Put out <accent><player></accent>.</success>"
  by-staff: "<prefix><success>A staff member put out your fire.</success>"

# /speed. <speed> is the level, 0 to 10 (1 is normal).
speed:
  usage: "<prefix><text>Usage: <accent>/speed</accent> <muted>[walk|fly] <0-10></muted></text> <muted>1 is normal.</muted>"
  walk: "<prefix><success>Walk speed set to <accent><speed></accent>.</success>"
  fly: "<prefix><success>Fly speed set to <accent><speed></accent>.</success>"

# /give and /i. <item> is the item's name (hover shows it), <amount> how many were given.
give:
  usage: "<prefix><text>Usage: <accent>/give</accent> <muted><player> <item> [amount]</muted></text>"
  usage-self: "<prefix><text>Usage: <accent>/i</accent> <muted><item> [amount]</muted></text>"
  unknown: "<prefix><error><input> isn't an item.</error> <muted>Use its id, like <accent>diamond_sword</accent>, with components in [brackets] if needed.</muted>"
  bad-amount: "<prefix><error>The amount is 1 to <max>.</error>"
  self: "<prefix><success>Here's <accent><amount></accent> × <item>.</success>"
  other: "<prefix><success>Gave <accent><player></accent> <accent><amount></accent> × <item>.</success>"
  by-staff: "<prefix><success>A staff member gave you <accent><amount></accent> × <item>.</success>"
  partial: "<prefix><error><left> more didn't fit, so they weren't given.</error>"
  no-room: "<prefix><error><player>'s inventory is full.</error>"

more:
  done: "<prefix><success>Topped up to <accent><amount></accent>.</success>"
  empty: "<prefix><muted>Hold the item you want more of.</muted>"
  full: "<prefix><muted>That stack is already full.</muted>"

repair:
  usage: "<prefix><text>Usage: <accent>/repair</accent> <muted>[hand|all]</muted></text>"
  hand: "<prefix><success>Repaired the item in your hand.</success>"
  all: "<prefix><success>Repaired <accent><count></accent> items.</success>"
  nothing-hand: "<prefix><muted>That doesn't need repairing.</muted>"
  nothing-all: "<prefix><muted>Nothing you're carrying needs repairing.</muted>"
  no-all: "<prefix><error>You can only repair the item in your hand.</error>"

# /clearinventory. <count> is how many stacks were removed.
clear:
  self: "<prefix><text>Cleared your inventory</text> <muted>(<count> stacks).</muted>"
  other: "<prefix><text>Cleared <accent><player></accent>'s inventory</text> <muted>(<count> stacks).</muted>"
  by-staff: "<prefix><error>A staff member cleared your inventory.</error>"
  empty: "<prefix><muted>There's nothing to clear.</muted>"

# /disposal: the menu title.
disposal:
  title: "<dark>Disposal</dark> <muted>(deleted on close)</muted>"

# /broadcast. <message> is the admin's text (MiniMessage, brand tags work).
broadcast:
  format: "<primary><bold>ANNOUNCEMENT</bold></primary> <dark>»</dark> <text><message></text>"
  usage: "<prefix><text>Usage: <accent>/broadcast</accent> <muted><message></muted></text>"
  local-only: "<prefix><error>Couldn't reach the other servers;</error> <muted>it was only shown here.</muted>"

admin:
  usage: "<prefix><text>Usage: <accent>/essentials</accent> <muted>reload|version</muted></text>"
  version: "<prefix><text>rapid-essentials <accent><version></accent></text>"
  reloaded: "<prefix><success>rapid-essentials config and messages reloaded.</success>"
  reload-failed: "<prefix><error>The new config is invalid; the old one is still running. See the console.</error>"
