    top-lore: "<muted>More realms arrive with future seasons.</muted>"
    biome: "<primary>Island biome</primary>"
    biome-lore: "<muted>Pick a biome your realm has unlocked.</muted>"
    biome-current: "<primary>★ Current biome</primary>"
    biome-pick: "<success>Click to switch</success> <muted>(unlocked at <tier><muted>)</muted>"
    biome-locked: "<muted>Unlocks at</muted> <tier>"
    generator: "<primary>Generator odds</primary>"
    generator-line: "<text><block></text> <dark>»</dark> <accent><percent>%</accent>"
