  bought: "<prefix><success>Bought <amount>×</success> <item> <success>for</success> <accent><cost> Coins</accent><success>.</success> <muted>Balance: <balance></muted>"
  cant-afford: "<prefix><error>That costs <accent><cost> Coins</accent>; you have <balance>.</error>"
  full: "<prefix><error>Your inventory has no room for that.</error>"
