    harvest: "<text>Harvest <accent><amount></accent> <item></text>"
    sell: "<text>Earn <accent><amount></accent> Coins at the shop</text>"
    fish: "<text>Catch <accent><amount></accent> fish from your island</text>"
    expedition: "<text>Join <accent><amount></accent> Expedition(s)</text>"
