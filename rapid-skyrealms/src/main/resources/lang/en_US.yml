    state-locked: "<muted>Locked</muted>"
    cost: "<muted>Ascending costs <accent><cost> Coins</accent></muted>"
    progress: "<text><have></text><dark> / </dark><muted><need></muted>"
    goal-done: "<success>✔ Done</success>"
    goal-open: "<muted>In progress</muted>"
    ascend: "<primary><bold>Ascend to</bold></primary> <tier>"
