  sell-usage: "<prefix><text>Usage: <accent>/sell hand</accent> or <accent>/sell all</accent></text>"

# Expeditions (/expedition).
expedition:
  theme:
    crystal-caverns:
      name: "<#C58CF2><bold>Crystal Caverns</bold></#C58CF2>"
      about: "<muted>An open geode, amethyst spires and ore in the crags.</muted>"
      heart: "<#C58CF2><bold>Geode Heart</bold></#C58CF2>"
    sunken-ship:
      name: "<#5FC9C9><bold>Sunken Ship</bold></#5FC9C9>"
      about: "<muted>A beached wreck with cargo in the hold, tide pools and a reef.</muted>"
      heart: "<#FFC94D><bold>Captain's Chest</bold></#FFC94D>"
    overgrown-ruins:
      name: "<#7CB342><bold>Overgrown Ruins</bold></#7CB342>"
      about: "<muted>Mossy walls, wild melons and bee nests.</muted>"
      heart: "<#8BD45A><bold>Ancient Altar</bold></#8BD45A>"
  warning: "<prefix><text>An Expedition, the</text> <theme><text>, drifts into SkyRealms in <accent><minutes> minutes</accent>!</text> <muted>Join in with <click:run_command:'/play skyrealms'><hover:show_text:'<muted>Click to go to SkyRealms</muted>'><accent>/play skyrealms</accent></hover></click>.</muted>"
  arrived: "<prefix><text>The</text> <theme> <text>has arrived! It stays <accent><minutes> minutes</accent>.</text> <click:run_command:'/expedition go'><hover:show_text:'<muted>Click to go there</muted>'><accent>[Go: /expedition go]</accent></hover></click>"
  welcome: "<prefix><text>Welcome to the</text> <theme><text>! Mine its resource blocks; what they give goes straight to you. Strike the glowing heart together (the path from here leads to it): its loot is shared by everyone's hits.</text>"
  bar: "<theme> <dark>|</dark> <text><time></text> <dark>|</dark> <muted><nodes> left</muted> <dark>|</dark> <heart>"
  bar-heart: "<accent>Heart <hits>/<needed></accent>"
  bar-heart-broken: "<success>Heart broken</success>"
  # Floats over the heart. <heart> is the theme's heart name.
  heart-label: "<heart><newline><muted>Strike it together:</muted> <accent><hits>/<needed></accent>"
  points: "<success>+<gained> points</success> <muted>(<total> this Expedition)</muted>"
  strike: "<accent>Heart struck!</accent> <muted>Your hits: <mine> · Together: <hits>/<needed></muted>"
  heart-share: "<prefix><success>The heart broke! You struck it <hits> of <total> times; your share of its loot is in your inventory.</success>"
  heart-broken: "<prefix><primary>The heart has broken!</primary> <muted><players> players shared its loot.</muted>"
  leaving-soon: "<prefix><accent>The Expedition drifts away in a minute!</accent> <muted>Everyone here goes home when it does.</muted>"
  summary: "<prefix><text>Expedition over: <accent><points> points</accent> and <accent><hits></accent> heart strikes earned you <accent><coins> Coins</accent>.</text>"
  departed: "<prefix><text>The</text> <theme> <text>drifted away. <accent><players></accent> players harvested it.</text>"
  fell: "<prefix><muted>Careful! Back to the landing pad.</muted>"
  not-here: "<prefix><muted>No Expedition is here right now. The next, the</muted> <theme><muted>, comes in about <minutes> minutes.</muted>"
  status-next: "<prefix><text>The next Expedition, the</text> <theme><text>, arrives in about <accent><minutes> minutes</accent>.</text>"
  status-arriving: "<prefix><text>The</text> <theme> <text>is drifting in now, about <accent><minutes> minutes</accent> out!</text>"
  status-here: "<prefix><text>The</text> <theme> <text>is here for <accent><minutes> more minutes</accent>.</text> <click:run_command:'/expedition go'><hover:show_text:'<muted>Click to go there</muted>'><accent>[Go]</accent></hover></click>"
  status-leaving: "<prefix><muted>The</muted> <theme> <muted>is drifting away.</muted>"
  started: "<prefix><success>An Expedition is on its way.</success>"
  busy: "<prefix><error>An Expedition is already here or arriving.</error>"
  stopped: "<prefix><success>The Expedition is leaving; contributors are being paid.</success>"
  not-active: "<prefix><error>No Expedition is here.</error>"
  unknown-theme: "<prefix><error>Unknown theme.</error> <muted>Use one of: <themes></muted>"

# Trade Routes (/route). <id>, <partner>, <seller>, <buyer>, <item>, <qty>, <price>, <interval>
# and <role> (selling/buying, from the reader's island) are always available.
route:
  role-selling: "<success>selling</success>"
  role-buying: "<accent>buying</accent>"
  usage: "<prefix><text>Usage: <accent>/route</accent> (menu), <accent>/route offer</accent>, <accent>accept|decline|cancel|chest <id></accent>, <accent>depot</accent></text>"
  offer-usage: "<prefix><text>Hold the item, then: <accent>/route offer <island or player> <sell|buy> <amount> <price> [<intervals>]</accent></text> <muted>e.g. /route offer Steve sell 64 2000 weekly</muted>"
  admin-usage: "<prefix><text>Usage: <accent>/route admin end <id></accent></text>"
  admin-ended: "<prefix><success>Route #<id> ended.</success>"
  hold-item: "<prefix><error>Hold a plain stack of what's being traded</error> <muted>(no names, enchantments or damage)</muted><error>.</error>"
  no-such-island: "<prefix><error>No island called <island>, and no player by that name has one.</error>"
  own-island: "<prefix><error>That's your own island.</error>"
  bad-quantity: "<prefix><error>The amount must be <min_qty> to <max_qty>.</error>"
  bad-price: "<prefix><error>The price must be <min_price> to <max_price> Coins.</error>"
  bad-interval: "<prefix><error>The interval must be one of: <intervals>.</error>"
  full-own: "<prefix><error>Your island already takes part in <cap> routes, its limit</error> <muted>(more with each Realm Tier)</muted><error>.</error>"
  full-other: "<prefix><error><island> can't take on another route right now.</error>"
  offered: "<prefix><success>Offer #<id> sent to <partner>:</success> <text><role> <qty>×</text> <item> <text>every <interval> for <accent><price> Coins</accent>.</text> <muted>They have a few days to answer.</muted>"
  offer-received: "<prefix><primary><from></primary> <text>offers a Trade Route: you'd be <role> <qty>×</text> <item> <text>every <interval> for <accent><price> Coins</accent>.</text> <click:run_command:'/route accept <id>'><hover:show_text:'<muted>Click to accept</muted>'><success>[Accept]</success></hover></click> <click:run_command:'/route decline <id>'><hover:show_text:'<muted>Click to decline</muted>'><error>[Decline]</error></hover></click>"
  no-offer: "<prefix><error>There's no open offer #<id> for your island.</error>"
  no-route: "<prefix><error>Your island has no route #<id>.</error>"
  signed: "<prefix><success>Trade Route #<id> with <partner> is signed!</success> <text>You're <role> <qty>×</text> <item> <text>every <interval> for <accent><price> Coins</accent>; the first delivery is in one <interval> period.</text>"
  set-chest-hint: "<prefix><text>Set your contract chest: look at a chest or barrel on your island (hoppers can fill it) and run</text> <click:suggest_command:'/route chest <id>'><hover:show_text:'<muted>Click to type it</muted>'><accent>/route chest <id></accent></hover></click><text>.</text>"
  not-seller: "<prefix><error>Route #<id> isn't one your island sells on.</error>"
  look-at-chest: "<prefix><error>Look at a chest or barrel (within 6 blocks).</error>"
  chest-not-on-island: "<prefix><error>The contract chest has to be on your island.</error>"
  chest-taken: "<prefix><error>That chest already serves another route.</error>"
  chest-set: "<prefix><success>Contract chest set for route #<id>.</success> <muted>Keep <qty>× <item> in it for each delivery.</muted>"
  delivered: "<prefix><success>Route #<id> delivered <qty>×</success> <item> <success>(<seller> → <buyer>, <price> Coins).</success> <muted>Buyers: collect from <click:run_command:'/route depot'><hover:show_text:'<muted>Click to open</muted>'><accent>/route depot</accent></hover></click>.</muted>"
  returned: "<prefix><text><amount>×</text> <item> <text>from route #<id> couldn't be delivered and waits in your</text> <click:run_command:'/route depot'><hover:show_text:'<muted>Click to open</muted>'><accent>depot</accent></hover></click><text>.</text>"
  missed-no-chest: "<prefix><error>Route #<id> missed a delivery: the seller has no contract chest set.</error> <muted>(<misses>/<max> in a row ends it)</muted>"
  missed-short: "<prefix><error>Route #<id> missed a delivery: the contract chest didn't hold <qty>×</error> <item><error>.</error> <muted>(<misses>/<max> in a row ends it)</muted>"
  missed-unpaid: "<prefix><error>Route #<id> missed a delivery: <buyer>'s leader couldn't pay <price> Coins.</error> <muted>(<misses>/<max> in a row ends it)</muted>"
  ended-declined: "<prefix><muted>Offer #<id> (<qty>× <item>) was declined by <player>.</muted>"
  ended-cancelled: "<prefix><muted>Trade Route #<id> with <partner> was cancelled by <player>.</muted>"
  ended-expired: "<prefix><muted>Offer #<id> to <partner> expired unanswered.</muted>"
  ended-missed: "<prefix><error>Trade Route #<id> with <partner> ended after too many missed deliveries.</error>"
  ended-disbanded: "<prefix><muted>Trade Route #<id> ended: an island was disbanded.</muted>"
  ended-staff: "<prefix><muted>Trade Route #<id> with <partner> was ended by staff.</muted>"
  depot-full: "<prefix><error>Your inventory has no room for that.</error>"
  depot-taken: "<prefix><success>Took <amount>×</success> <item> <success>from the depot.</success>"
  menu:
    title: "<dark>Trade Routes » </dark><primary><island></primary>"
    depot-title: "<dark>Depot » </dark><primary><island></primary>"
    route: "<primary>#<id></primary> <text><role> <qty>×</text> <item>"
    terms: "<muted>With <text><partner></text>, every <interval>, for <accent><price> Coins</accent></muted>"
    waiting: "<muted>Waiting for <partner> to answer.</muted>"
    answer: "<success>Left-click: accept</success> <dark>·</dark> <error>Shift-right: decline</error>"
    next: "<text>Next delivery in <accent><time></accent></text>"
    deliveries: "<muted>Delivered <count> times · <missed> missed in a row</muted>"
    chest: "<muted>Contract chest at <x> <y> <z></muted>"
    no-chest: "<error>No contract chest yet: /route chest <id></error>"
    cancel: "<muted>Shift-right: cancel the route</muted>"
    none: "<muted>No Trade Routes yet</muted>"
    none-lore: "<muted>Offer one to another island with /route offer.</muted>"
    how: "<primary>How Trade Routes work</primary>"
    how-lore:
      - "<muted>Hold the item and type:</muted>"
      - "<accent>/route offer <island> <sell|buy> <amount> <price> <daily|weekly></accent>"
