    depot-amount: "<text><amount> waiting</text>"
    depot-take: "<muted>Click: take a stack · Shift-click: take all that fits</muted>"
    depot-empty: "<muted>The depot is empty</muted>"
    back: "<muted>« Routes</muted>"

