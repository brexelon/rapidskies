  ascended: "<prefix><success><player> ascended your island to</success> <tier><success>!</success> <muted>The generator changed, a new biome and shop goods are open, and rewards went to <player>.</muted>"
  announce: "<prefix><primary><island></primary> <text>has reached</text> <tier><text>!</text>"
  biome-set: "<prefix><success>Your island's biome is now</success> <biome><success>.</success>"
