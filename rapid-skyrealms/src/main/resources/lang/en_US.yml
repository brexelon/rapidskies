# rapid-skyrealms messages (MiniMessage). Brand tags: <primary> <accent> <text> <muted> <dark>
# <success> <error>, and <prefix> for "RAPIDSKIES »".
#
# Every supported client (1.20 – 26.3) renders hex colors, <gradient>, <hover>, <click>
# and <key> exactly. Don't use <shadow> (1.21.4+), <sprite>/<head> (1.21.9+) or anything else
# newer than 1.20. Item names, lore and menu titles are components too, but clicks and hovers
# do nothing there. <item> is always the item's real (translated) name.

errors:
  players-only: "<prefix><error>Only players can use this.</error>"
  no-permission: "<prefix><error>You can't use that.</error>"
  database: "<prefix><error>Something went wrong saving that. Nothing was lost; try again in a moment.</error>"
  no-island: "<prefix><error>You don't have an island yet.</error> <muted>Start one with <click:run_command:'/island create'><hover:show_text:'<muted>Click to run it</muted>'><accent>/island create</accent></hover></click>.</muted>"
  not-manager: "<prefix><error>Only your island's leader or admins can do that.</error>"

admin:
  usage: "<prefix><text>Usage: <accent>/skyrealms reload</accent> or <accent>/skyrealms here</accent></text>"
  reloaded: "<prefix><success>rapid-skyrealms config and messages reloaded, NPCs rebuilt.</success> <muted>(Island layouts change on a restart.)</muted>"
  reload-failed: "<prefix><error>The new config is invalid; the old one is still running. See the console.</error>"
  # /skyrealms here. <point> is an NPC location (config npcs.<id>.location); click it to copy.
  here: "<prefix><text>Here:</text> <accent><point></accent> <muted>(NPC location)</muted>"
  copy-hint: "<muted>Click to copy"

# The sidebar (PlaceholderAPI, through TAB).
placeholder:
  no-island: "<muted>No island</muted>"
  expedition-next: "<muted>in <minutes>m</muted>"
  expedition-arriving: "<accent>arriving <minutes>m</accent>"
  expedition-here: "<success>here! <minutes>m</success>"
  expedition-leaving: "<muted>drifting away</muted>"

# NPCs round the Trading Post's compass rose (config npcs). The label over each one is
# npc.label with its name and hint.
npc:
  label: "<name>\n<hint>"
  island:
    name: "<primary><bold>Island Keeper</bold></primary>"
    hint: "<accent>Click to start or visit your island</accent>"
  shop:
    name: "<primary><bold>Merchant</bold></primary>"
    hint: "<accent>Click to buy and sell</accent>"
  realm:
    name: "<primary><bold>Realm Warden</bold></primary>"
    hint: "<accent>Click for your Realm Tier and goals</accent>"
  expedition:
    name: "<primary><bold>Expedition Captain</bold></primary>"
    hint: "<accent>Click to see the next Expedition</accent>"
  route:
    name: "<primary><bold>Route Master</bold></primary>"
    hint: "<accent>Click to trade with other islands</accent>"
  hub:
    name: "<primary><bold>Lobby</bold></primary>"
    hint: "<accent>Click to go back to the hub</accent>"

