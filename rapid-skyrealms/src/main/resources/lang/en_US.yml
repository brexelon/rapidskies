      name: "<#E8C872><bold>Desert</bold></#E8C872>"
      about: "<muted>Iron and gold in the generator, the desert biome, and the desert shop.</muted>"
    frost:
      name: "<#9FD8F2><bold>Frost</bold></#9FD8F2>"
      about: "<muted>Lapis, redstone, diamonds and emeralds, the snowy biome (water freezes to ice), and the frost shop.</muted>"
