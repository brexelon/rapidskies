# rapid-skyrealms: the SkyRealms gamemode on top of SuperiorSkyblock2 (PLAN.md §5.1).
# Messages are in lang/en_US.yml. `/skyrealms reload` re-reads both; the island layouts are
# registered with SuperiorSkyblock2 at startup, so a change to `islands` needs a restart.
#
# Items are material keys (`wheat`, `minecraft:oak_sapling`), with an optional amount
# (`bread x8`). Progression-critical items all exist in Minecraft 1.20 (PLAN.md §3).

# Starter islands: one per layout, built by rapid-skyrealms' code (island/IslandLayouts) and
# registered with SuperiorSkyblock2 as schematics of the same name. The creation menu
# (profiles/skyrealms/plugins/SuperiorSkyblock2/menus/island-creation.yml) lists them. All three
# give the same start; only the tree and the look differ.
islands:
  # Ids of the layouts to register: meadow (oak), cherry (cherry grove), atoll (sand rim, jungle tree).
  layouts: [meadow, cherry, atoll]
  # What the starter chest holds on every layout (each also adds two saplings of its own tree).
  starter-chest:
    - "lava_bucket"
    - "ice x2"
    - "wheat_seeds x4"
    - "sugar_cane x2"
    - "cactus"
    - "melon_slice x2"
    - "pumpkin_seeds x2"
    - "bone_meal x8"
    - "bread x8"
    - "torch x8"

# Realm Tiers (PLAN.md §5.1): Meadow → Desert → Frost at launch (Nether Rift and Sky Citadel
# later). An island works toward the next tier's `requires` goals; when they're all done, the
# island leader (or a role with `manage-role-weight`) ascends it for `cost` Coins (`icon` is
# its menu item). Each tier
# sets the island's cobblestone generator (`generator`: weights per block, any scale), unlocks
# its biome for /realm biome and its shop categories, and hands out `rewards` items once.
#
# Goals (progress is shared by every island member, counted on the island):
#   level <n>            island level of at least n (SuperiorSkyblock2's)
#   mine <block> <n>     blocks from the island's generator broken (placed blocks never count)
#   harvest <crop> <n>   grown crops, cactus, sugar cane, melons or pumpkins harvested (not placed ones)
#   sell <coins>         Coins earned selling to /shop
#   fish <n>             fish caught from the island
#   expedition <n>       Expeditions a member contributed to
#   route <n>            Trade Route deliveries made as the seller
tiers:
  meadow:
    icon: grass_block
    biome: plains
    cost: 0
    generator:
      cobblestone: 84
      coal_ore: 10
      copper_ore: 6
    rewards: []
  desert:
    icon: sand
    biome: desert
    cost: 5000
    requires:
      - "level 10"
      - "mine cobblestone 1000"
      - "harvest wheat 256"
      - "sell 2500"
      - "expedition 1"
    generator:
      cobblestone: 70
      coal_ore: 11
      copper_ore: 8
      iron_ore: 8
      gold_ore: 3
    rewards:
      - "sand x32"
      - "cactus x2"
      - "dead_bush x2"
  frost:
    icon: snow_block
    biome: snowy_plains
    cost: 25000
    requires:
      - "level 50"
      - "mine iron_ore 500"
      - "harvest cactus 512"
      - "sell 25000"
      - "fish 64"
      - "expedition 3"
      - "route 2"
    generator:
      cobblestone: 56
      coal_ore: 11
      copper_ore: 8
      iron_ore: 11
      gold_ore: 6
      lapis_ore: 3
      redstone_ore: 3
      diamond_ore: 1
      emerald_ore: 1
    rewards:
      - "ice x16"
      - "snow_block x16"
      - "spruce_sapling x2"

# Who may ascend tiers and sign Trade Routes for an island besides its leader: SuperiorSkyblock2
# role weight (0 Member, 1 Moderator, 2 Admin, 3 Leader in its default ladder).
manage-role-weight: 2

# The server shop (/shop, /sell). Each item is "<material> <buy> <sell>": Coins per item (decimals
# allowed; a sale's total is rounded down), 0 to not buy or not sell it. Selling never pays more
# than buying costs. A category opens at its `tier` (the island's Realm Tier; players without an
# island count as on the first tier). Only plain items sell: nothing named, enchanted or damaged.
