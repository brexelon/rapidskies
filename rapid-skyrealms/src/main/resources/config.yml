# Expeditions (PLAN.md §5.1): every few hours a resource island drifts into the shared
# Expedition world. Its resource blocks drop straight into the miner's inventory (no ground
# loot to steal) and earn contribution points; its heart takes many hits from everyone, and
# when it breaks its loot is split by each player's share of the hits, never last-hit. When
# it drifts away, every contributor is paid Coins for their points, plus Bolts.
# Heart loot is per player: someone who struck it as often as the average gets the listed
# amounts, more or less in proportion to their hits (up to double).
expeditions:
  # rapid-core creates this void world (profiles/skyrealms/plugins/rapid-core: worlds).
  world: "rapidskies:expeditions"
  # Islands are built at y `height`, each one `spacing` blocks east of the last (cycling every
  # 8), so a crash never leaves one under the next.
  height: 120
  spacing: 512
  # Average time between Expeditions, plus or minus `jitter-minutes`.
  interval-minutes: 180
  jitter-minutes: 20
  # The network hears about it this long before it arrives (PLAN.md: a scheduled social moment).
  warning-minutes: 5
  # How long it stays before it drifts away.
  duration-minutes: 15
  # Players online on this server needed for a scheduled one (/expedition start ignores it).
  min-players: 2
  # Themes in rotation order (crystal-caverns, sunken-ship, overgrown-ruins).
  themes: [crystal-caverns, sunken-ship, overgrown-ruins]
  # Heart: hits needed = per-player × players in the Expedition world when it arrives (at least min-hits).
  heart:
    hits-per-player: 12
    min-hits: 24
  # Pay at the end: Coins per contribution point (Tailwind applies), and Bolts for everyone
  # with at least `min-points` (rapid-core's anti-farm rules, capped per day).
  coins-per-point: 6
  min-points: 5
  bolts: 10
  bolts-daily-cap: 30
  # Resource blocks per theme: points and what each break gives ("<item> x<min>-<max>" or "x<n>").
  themes-config:
    crystal-caverns:
      nodes:
        iron_ore: { points: 2, loot: ["raw_iron x1-2"] }
        gold_ore: { points: 3, loot: ["raw_gold x1-2"] }
        lapis_ore: { points: 2, loot: ["lapis_lazuli x3-6"] }
        redstone_ore: { points: 2, loot: ["redstone x3-5"] }
        diamond_ore: { points: 8, loot: ["diamond x1"] }
        emerald_ore: { points: 6, loot: ["emerald x1"] }
        amethyst_block: { points: 1, loot: ["amethyst_shard x2-4"] }
      heart: ["diamond x6", "emerald x4", "amethyst_shard x24", "budding_amethyst x1"]
    sunken-ship:
      nodes:
        barrel: { points: 4, loot: ["gold_ingot x1-3", "emerald x0-1", "iron_ingot x1-3"] }
        prismarine: { points: 1, loot: ["prismarine_shard x2-4"] }
        sea_lantern: { points: 2, loot: ["prismarine_crystals x2-4"] }
        wet_sponge: { points: 3, loot: ["sponge x1"] }
        dried_kelp_block: { points: 1, loot: ["kelp x2-5"] }
      heart: ["heart_of_the_sea x1", "nautilus_shell x4", "gold_block x2", "prismarine_crystals x16"]
    overgrown-ruins:
      nodes:
        mossy_cobblestone: { points: 1, loot: ["moss_block x1", "cobblestone x1-2"] }
        cracked_stone_bricks: { points: 2, loot: ["iron_nugget x3-9", "gold_nugget x2-6"] }
        melon: { points: 1, loot: ["melon_slice x3-6"] }
        pumpkin: { points: 1, loot: ["pumpkin x1", "pumpkin_seeds x1"] }
        bee_nest: { points: 4, loot: ["honeycomb x2-4", "honey_bottle x1"] }
        moss_block: { points: 1, loot: ["moss_block x1", "azalea x0-1"] }
      heart: ["golden_apple x2", "bone_meal x48", "emerald x3", "flowering_azalea x2"]

# Trade Routes (PLAN.md §5.1): recurring contracts between islands. The seller's goods come
# out of a contract chest on their island (hoppers can feed it), go to the buyer's depot
# (/route depot), and the buyer island's leader pays the seller island's leader at each delivery.
routes:
  # Active and offered routes per island (as seller or buyer): base, plus `per-tier` for each
  # Realm Tier past the first.
  max-per-island: 2
  per-tier: 1
  # Kept from each payment (an economy sink).
  tax-percent: 3
  # Delivery intervals on offer, by name, in hours.
  intervals: { daily: 24, weekly: 168 }
  min-quantity: 16
  max-quantity: 1728
  min-price: 10
  max-price: 1000000
  # An offer nobody answers is withdrawn after this many hours.
  offer-hours: 72
  # Missed deliveries in a row (goods not in the chest, or the buyer couldn't pay) that end a route.
  max-missed: 3
  # How often due routes are checked.
  check-seconds: 60

# Seasons (PLAN.md §5.1): every `length-days` the island-value leaderboard (/season) starts over.
# Islands keep everything; the ranking is the worth gained during the season. When it ends,
# every member of the top islands gets the award of the best rank they reached: a cosmetic for
# the cosmetics engine (<n> is the season number) and Bolts, once.
seasons:
  enabled: true
  length-days: 90
  awards:
    - { top: 1, cosmetic: "title:season-<n>-champion", bolts: 500 }
    - { top: 3, cosmetic: "title:season-<n>-podium", bolts: 250 }
    - { top: 10, cosmetic: "badge:season-<n>-top10", bolts: 100 }

# Citizens NPCs round the Trading Post's compass rose (Citizens is in the skyrealms plugin set).
# The skyrealms profile sets the locations ("world, x, y, z, yaw, pitch"); an NPC without one
# isn't spawned. Names and click hints are lang npc.<id>.name and npc.<id>.hint. Clicking
# (either button) does the action:
#   command:<command>   run a command as the player, e.g. "command:shop"
#   server:<group>      join a server group through the proxy queue, e.g. server:hub
# Skin: a Minecraft account name (looked up once by Citizens), or a fixed texture and
# signature (from mineskin.org) so it never changes. Empty: a default skin.
npcs:
  island:
    location: ""
    action: "command:is"
    skin: ""
    skin-texture: ""
    skin-signature: ""
  shop:
    location: ""
    action: "command:shop"
    skin: ""
    skin-texture: ""
    skin-signature: ""
  realm:
    location: ""
    action: "command:realm"
    skin: ""
    skin-texture: ""
    skin-signature: ""
  expedition:
    location: ""
    action: "command:expedition"
    skin: ""
    skin-texture: ""
    skin-signature: ""
  route:
    location: ""
    action: "command:route"
    skin: ""
    skin-texture: ""
    skin-signature: ""
  hub:
    location: ""
    action: "server:hub"
    skin: ""
    skin-texture: ""
    skin-signature: ""

# The auction house (rapid-market): one more listing per `levels-per-listing` island levels,
# up to `max-extra` (PLAN.md §4.2: it rises with island level, never with rank).
market:
  levels-per-listing: 100
  max-extra: 10
