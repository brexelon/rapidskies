# rapid-claims messages (MiniMessage). Brand tags: <primary> <accent> <text> <muted> <dark>
# <success> <error>, and <prefix> for "RAPIDSKIES »". Every supported client (1.20 – 26.3)
# renders hex colors, <hover>, <click> and <key>; don't use anything newer than 1.20.
# Menu titles, item names and lore are components too, but clicks and hovers do nothing there.

errors:
  players-only: "<prefix><error>Only players can do that.</error>"
  database: "<prefix><error>Something went wrong saving that. Please try again in a moment.</error>"
  no-crowns: "<prefix><error>Crowns aren't available on this server.</error>"
  unknown-player: "<prefix><error>Nobody called <accent><player></accent> has played here.</error>"

# How an owner is named in messages. <name> is the player's name, or the town's in its tag color.
owner:
  player: "<accent><name></accent><text>'s land</text>"
  town: "<text>the town of </text><name>"
  unknown-town: "<muted>an old town</muted>"

# Trust roles (PLAN.md §4.1).
role:
  visitor: "<muted>Visitor</muted>"
  trusted: "<text>Trusted</text>"
  member: "<accent>Member</accent>"
  builder: "<primary>Builder</primary>"
  co-owner: "<primary><bold>Co-owner</bold></primary>"
  owner: "<primary><bold>Owner</bold></primary>"

flag:
  pvp:
    name: "<text>PvP</text>"
    lore:
      - "<muted>Players can fight each other here.</muted>"
      - "<muted>Off by default; on makes it a PvP area.</muted>"
  mob-spawning:
    name: "<text>Monster spawning</text>"
    lore:
      - "<muted>Monsters spawn here in the dark.</muted>"
  fire-spread:
    name: "<text>Fire spread</text>"
    lore:
      - "<muted>Fire spreads and burns blocks here.</muted>"
  leaf-decay:
    name: "<text>Leaf decay</text>"
    lore:
      - "<muted>Leaves away from logs fall apart.</muted>"

menu:
  close: "<error>Close</error>"
  back: "<text>Back</text>"

claim:
  help:
    - "<prefix><primary>Claims</primary> <dark>·</dark> <muted>you start with chunks to claim; play to earn more.</muted>"
    - "<dark>»</dark> <hover:show_text:'<muted>Click to run'><click:run_command:/claim><accent>/claim</accent></click></hover> <muted>claim the chunk you stand in</muted>"
    - "<dark>»</dark> <hover:show_text:'<muted>Click to run'><click:run_command:/claim map><accent>/claim map</accent></click></hover> <muted>claim and unclaim by clicking a map</muted>"
    - "<dark>»</dark> <accent>/claim trust <player|*> [trusted|member|builder|co-owner]</accent> <muted>let others in</muted>"
    - "<dark>»</dark> <accent>/claim untrust</accent><dark>,</dark> <accent>/claim trusted</accent><dark>,</dark> <accent>/claim deny <player></accent><dark>,</dark> <accent>/claim undeny</accent>"
    - "<dark>»</dark> <accent>/claim flags</accent><dark>,</dark> <accent>/claim info</accent><dark>,</dark> <accent>/claim list</accent><dark>,</dark> <accent>/claim show</accent><dark>,</dark> <accent>/claim unclaim</accent>"
    - "<dark>»</dark> <accent>/claim allowance</accent><dark>,</dark> <accent>/claim buy [chunks]</accent> <muted>more land for Crowns</muted>"
  not-claimable: "<prefix><error>Land can only be claimed in the Heartland.</error>"
  already-yours: "<prefix><muted>This chunk is already yours.</muted>"
  taken: "<prefix><error>This chunk is <owner></error><error>.</error>"
  no-allowance: "<prefix><error>You've used all <total> of your chunks.</error> <muted>Earn more by playing, or</muted> <hover:show_text:'<muted>Click to see the price'><click:run_command:/claim buy><accent>buy one with Crowns</accent></click></hover><muted>.</muted>"
  race-lost: "<prefix><error>Someone claimed that chunk a moment before you.</error>"
  claimed: "<prefix><success>Claimed chunk <x>, <z>.</success> <muted>You've used <used> of <total> chunks.</muted>"
  unclaimed: "<prefix><text>Chunk <x>, <z> is no longer yours.</text> <muted>Your builds stay, unprotected.</muted>"
  not-claimed: "<prefix><muted>Nobody has claimed this chunk.</muted>"
  not-yours: "<prefix><error>This chunk is <owner></error><error>, not yours.</error>"
  town-land-unclaim: "<prefix><error>This is town land.</error> <muted>Use <accent>/town unclaim</accent>.</muted>"
  info: |-
    <prefix><primary>Chunk <x>, <z></primary> <dark>·</dark> <owner>
    <dark>»</dark> <muted>Claimed</muted> <text><since></text> <dark>·</dark> <muted>you're</muted> <role>
    <dark>»</dark> <muted>Flags on:</muted> <text><flags></text>
  info-no-flags: "none"
  info-plot: "<dark>»</dark> <muted>Plot of</muted> <accent><resident></accent>"
  info-wilderness: "<prefix><text>Chunk <x>, <z> is wilderness.</text> <hover:show_text:'<muted>Click to claim it'><click:run_command:/claim><accent>Claim it</accent></click></hover>"
  list-header: "<prefix><primary>Your land</primary> <muted>(<used> of <total> chunks)</muted>"
  list-line: "<dark>»</dark> <text>Chunk <x>, <z></text> <muted>around <bx>, <bz></muted>"
  list-more: "<dark>»</dark> <muted>and <count> more</muted>"
  allowance: |-
    <prefix><primary>Claim allowance</primary> <muted>(<used> of <total> used)</muted>
    <dark>»</dark> <text><starter></text> <muted>to start with</muted>
    <dark>»</dark> <text><playtime></text><muted>/<playtime-max> for playtime (one per <hours> h here)</muted>
    <dark>»</dark> <text><extra></text> <muted>from Trade levels</muted>
    <dark>»</dark> <text><purchased></text> <muted>bought with Crowns, next one</muted> <accent><next-price> Crowns</accent>
    <dark>»</dark> <text><bonus></text> <muted>granted by staff</muted>

buy:
  usage: "<prefix><muted>Use <accent>/claim buy [chunks]</accent>.</muted>"
  limit: "<prefix><error>You've bought <bought> chunks; the limit is <max>.</error>"
  quote: "<prefix><text><count> more chunk(s) cost</text> <accent><price> Crowns</accent><text>.</text> <muted>(The one after costs <next>.)</muted> <hover:show_text:'<muted>Click to buy'><click:run_command:'/claim buy <count> confirm'><success>[Buy]</success></click></hover>"
  done: "<prefix><success>Bought <count> chunk(s) for <price> Crowns.</success>"
  too-poor: "<prefix><error>You need <price> Crowns for that.</error>"

trust:
  usage: "<prefix><muted>Use <accent>/claim trust <player|*> [trusted|member|builder|co-owner]</accent>.</muted>"
  untrust-usage: "<prefix><muted>Use <accent>/claim untrust <player|*></accent>.</muted>"
  bad-role: "<prefix><error>Roles: trusted, member, builder, co-owner.</error>"
  self: "<prefix><error>You can't change your own access.</error>"
  owner-only: "<prefix><error>Only the owner can hand out or change Co-owner access.</error>"
  denied-first: "<prefix><error><player> is kept out of this land.</error> <muted>Use <accent>/claim undeny <player></accent> first.</muted>"
  everyone: "everyone"
  set: "<prefix><success><player> is now</success> <role> <success>on</success> <owner><success>.</success>"
  removed: "<prefix><text><player> is no longer trusted on</text> <owner><text>.</text>"
  notify: "<prefix><text>You're now</text> <role> <text>on</text> <owner><text>.</text>"
  list-header: "<prefix><primary>Trusted on</primary> <owner>"
  list-line: "<dark>»</dark> <text><player></text> <dark>·</dark> <role>"
  list-empty: "<dark>»</dark> <muted>Nobody yet.</muted>"

deny:
  usage: "<prefix><muted>Use <accent>/claim deny <player></accent> or <accent>/claim undeny <player></accent>.</muted>"
  invalid: "<prefix><error>You can't keep that player out.</error>"
  trusted: "<prefix><error><player> is trusted here or a town member.</error> <muted>Untrust them first.</muted>"
  set: "<prefix><text><player> can no longer enter.</text>"
  removed: "<prefix><text><player> may enter again.</text>"
  notify: "<prefix><error>You've been kept out of</error> <owner><error>.</error>"
  list: "<dark>»</dark> <muted>Kept out:</muted> <text><players></text>"

flags:
  title: "<dark>Flags · chunk <x>, <z></dark>"
  state-on: "<success>✔ On</success>"
  state-off: "<error>✘ Off</error>"
  click:
    - "<accent>Click</accent> <muted>to switch for this chunk</muted>"
    - "<accent>Shift-click</accent> <muted>for all your land here</muted>"
  back: "<text>Claim map</text>"
  switched-on: "<prefix><flag> <success>is on</success> <muted>(<count> chunk(s)).</muted>"
  switched-off: "<prefix><flag> <error>is off</error> <muted>(<count> chunk(s)).</muted>"
  not-allowed: "<prefix><error>You can't change flags here.</error>"
  usage: "<prefix><muted>Use <accent>/claim flag <pvp|mob-spawning|fire-spread|leaf-decay> <on|off> [all]</accent>, or <accent>/claim flags</accent>.</muted>"

show:
  legend: "<prefix><muted>Borders:</muted> <primary>gold</primary> <muted>yours ·</muted> <aqua>diamond</aqua> <muted>your town ·</muted> <text>iron</text> <muted>trusted ·</muted> <error>redstone</error> <muted>others</muted>"

map:
  title: "<dark>Claim map</dark>"
  pan-west: "<text>◀ West</text>"
  pan-north: "<text>▲ North</text>"
  pan-south: "<text>▼ South</text>"
  pan-east: "<text>▶ East</text>"
  info-name: "<primary>Centre: chunk <x>, <z></primary>"
  info-lore:
    - "<muted>Your chunks:</muted> <text><used></text><muted>/<total> (<left> left)</muted>"
  info-town: "<muted>Town chunks:</muted> <text><count></text><muted>/<cap></muted>"
  info-recenter: "<accent>Click</accent> <muted>to centre on you</muted>"
  mode-personal: "<text>Claiming for: you</text>"
  mode-town: "<aqua>Claiming for: your town</aqua>"
  mode-lore:
    - "<accent>Click</accent> <muted>to switch between claiming</muted>"
    - "<muted>for yourself and for your town.</muted>"
  borders: "<text>Show borders</text>"
  borders-lore:
    - "<muted>Outlines claims around you</muted>"
    - "<muted>in the world for a few seconds.</muted>"
  flags: "<text>Flags here</text>"
  flags-lore:
    - "<muted>PvP, monsters, fire and leaves</muted>"
    - "<muted>for the chunk you stand in.</muted>"
  cell-coords: "<dark>Chunk <x>, <z></dark>"
  cell-here: "<primary>● You are here</primary>"
  cell-unclaimable: "<muted>Can't be claimed</muted>"
  cell-wilderness: "<text>Wilderness</text>"
  cell-owned: "<owner>"
  cell-plot: "<muted>Plot of</muted> <accent><resident></accent>"
  cell-ruins: "<error>Ruins: unclaimed soon unless the owner returns</error>"
  cell-your-role: "<muted>You're</muted> <role> <muted>here</muted>"
  click-claim: "<accent>Click</accent> <muted>to claim</muted>"
  click-claim-town: "<accent>Click</accent> <muted>to claim for your town</muted>"
  click-unclaim: "<accent>Right-click</accent> <muted>to unclaim</muted>"
  click-unclaim-town: "<accent>Right-click</accent> <muted>to unclaim for your town</muted>"
  switch-to-town: "<muted>Switch to town mode to change town land</muted>"

# Shown on the action bar when something is refused. <action> is from protect.action.
protect:
  denied: "<owner><dark>:</dark> <error>you need</error> <role> <error>access to <action>.</error>"
  no-pvp: "<error>PvP is off on this land.</error>"
  portal: "<error>A portal can't open on land you can't build on.</error>"
  action:
    use: "use that"
    container: "open containers"
    farm: "farm here"
    animals: "touch animals"
    build: "build"
    manage: "change settings"

entry:
  denied: "<error>You're kept out of</error> <owner><error>.</error>"
  wilderness: "<muted>Wilderness</muted>"
  land: "<text>Entering</text> <owner> <dark>·</dark> <pvp>"
  plot: "<text>Entering</text> <owner> <dark>·</dark> <muted>plot of</muted> <accent><resident></accent> <dark>·</dark> <pvp>"
  pvp-on: "<error>PvP on</error>"
  pvp-off: "<success>PvP off</success>"

ruins:
  restored: "<prefix><success>Welcome back! Your land had become ruins while you were away; it's yours again.</success>"

shop:
  claims-only: "<error>Shops can only go inside claimed land.</error>"
  needs-member: "<error>You need Member access on this land to open a shop here.</error>"

placeholder:
  no-town: "<muted>None</muted>"
  wilderness: "<muted>Wilderness</muted>"
  not-claimable: "<muted>—</muted>"

town:
  help:
    - "<prefix><primary>Towns</primary> <dark>·</dark> <muted>found one, or ask a mayor for an invite.</muted>"
    - "<dark>»</dark> <accent>/town create <name> <TAG></accent> <muted>found a town on the chunk you stand in</muted>"
    - "<dark>»</dark> <accent>/town</accent><dark>,</dark> <accent>/town info [town]</accent><dark>,</dark> <hover:show_text:'<muted>Click to run'><click:run_command:/town list><accent>/town list</accent></click></hover>"
    - "<dark>»</dark> <accent>/town invite</accent><dark>,</dark> <accent>join</accent><dark>,</dark> <accent>leave</accent><dark>,</dark> <accent>kick</accent><dark>,</dark> <accent>rank <player> <role></accent><dark>,</dark> <accent>mayor</accent><dark>,</dark> <accent>perms</accent>"
    - "<dark>»</dark> <accent>/town claim</accent><dark>,</dark> <accent>unclaim</accent><dark>,</dark> <accent>map</accent><dark>,</dark> <accent>plot <player>|clear</accent><dark>,</dark> <accent>trust</accent><dark>,</dark> <accent>deny</accent>"
    - "<dark>»</dark> <accent>/town deposit <amount></accent><dark>,</dark> <accent>withdraw <amount></accent> <muted>the bank pays daily upkeep</muted>"
    - "<dark>»</dark> <accent>/town projects</accent><dark>,</dark> <accent>warp</accent><dark>,</dark> <accent>setwarp</accent><dark>,</dark> <accent>vault</accent><dark>,</dark> <accent>tag</accent><dark>,</dark> <accent>color</accent><dark>,</dark> <accent>rename</accent>"
    - "<dark>»</dark> <accent>/tc <message></accent> <muted>town chat (<accent>/tc</accent> alone to switch)</muted><dark>,</dark> <accent>/town disband</accent>"
  role:
    mayor: "<primary>Mayor</primary>"
    assistant: "<accent>Assistant</accent>"
    resident: "<text>Resident</text>"
    recruit: "<muted>Recruit</muted>"
  role-short:
    mayor: "<primary>M</primary>"
    assistant: "<accent>A</accent>"
    resident: "<text>R</text>"
    recruit: "<muted>r</muted>"
