name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    name: Build plugin jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build dist --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: rapidskies-plugins-${{ github.sha }}
          path: build/dist/*.jar
          if-no-files-found: error

  infra:
    name: Check infra configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r infra/requirements.txt

      # Loads network.yml and every profile patch, and verifies each plugin glob
      # matches exactly one jar in plugins/ (if jars are committed).
      - name: Validate inventory and profiles
        run: python infra/rsdeploy.py check

      - name: Lint shell scripts
        run: shellcheck infra/host/*.sh
