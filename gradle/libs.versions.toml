[versions]
paper = "26.3.build.245-stable"
velocity = "4.3.1"
luckperms = "5.5"
# Provided at runtime by both Paper 26.3 and Velocity 4.3 (compileOnly everywhere).
adventure = "5.2.0"
gson = "2.14.0"
slf4j = "2.0.17"
snakeyaml = "2.2"
# Shaded and relocated into rapid-proxy and rapid-core (see rapid.plugin-conventions).
hikari = "7.1.0"
mariadb = "3.5.11"
jedis = "8.0.2"
# Tests
testcontainers = "2.0.5"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }

adventure-bom = { module = "net.kyori:adventure-bom", version.ref = "adventure" }
adventure-api = { module = "net.kyori:adventure-api" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }

testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
